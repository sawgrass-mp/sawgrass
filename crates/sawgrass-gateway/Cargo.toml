[package]
name = "sawgrass-gateway"
description = "Sawgrass gateway: terminates player connections over QUIC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
# QUIC transport (docs/architecture.md, "Gateways"). Only the tokio runtime and the ring TLS provider: no
# aws-lc-rs (C toolchain and an extra licence) and no platform verifier (peers pin the gateway certificate).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
sawgrass-protocol = { path = "../sawgrass-protocol" }
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
# Self-signed certificates for the integration tests, generated at run time so no key is committed.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
