[package]
name = "sawgrass-bots"
description = "Headless load-test bots that connect to a Sawgrass gateway like players."
version.workspace = true
edition.workspace = true
# rcgen pulls in `time` 0.3.47, which needs Rust 1.88 (see the gateway's Cargo.toml).
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
# Writes a self-signed certificate for a test server (`sawgrass-bots gen-cert`); the crate and features the
# gateway's tests already use.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
sawgrass-gateway = { path = "../sawgrass-gateway" }
sawgrass-protocol = { path = "../sawgrass-protocol" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }


# jemalloc as the global allocator (SRV-5, confirmed on the bots by BOT-3). `unprefixed_malloc` makes it the
# process's `malloc` too, so C code linked later (RocksDB) allocates through it as well. Unix only: jemalloc does not
# build for MSVC targets, which keep the system allocator.
[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }
[dev-dependencies]
sawgrass-server = { path = "../sawgrass-server" }

[lints]
workspace = true
