name: Claims
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths: [scripts/claims.py]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: claims-${{ github.event.issue.number || github.event.pull_request.number || github.event_name }}
  cancel-in-progress: false

# Runs the scripts from the default branch only: comment, timer and push events never check out pull request code,
# and the pull_request_target job checks out the default branch explicitly and reads the pull request through the
# API as data. The comment body reaches the script through the event file, never the shell.
jobs:
  command:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/claim') || contains(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I scripts/claims.py command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  expire:
    if: >-
      github.event_name != 'issue_comment' && github.event_name != 'pull_request_target' &&
      github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I scripts/claims.py expire
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The maintainer's own pull requests claim their task; any pull request that touches tier 3 paths gets the
  # `protected` label. Labelling a pull request through the issues API needs `pull-requests: write`.
  link:
    if: github.event_name == 'pull_request_target' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: github.event_name == 'pull_request_target'
        run: python3 -I scripts/claims.py link "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        run: python3 -I scripts/claims.py link-all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
