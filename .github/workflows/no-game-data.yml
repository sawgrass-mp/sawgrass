# Rejects tracked files whose extension marks game data or a binary (AGENTS.md, "No game data, ever"), then runs
# scripts/check_no_game_data.py, which matches file contents and catches renamed files.
name: No Game Data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-game-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      FORBIDDEN: rpf ttpf xvd msixvc dxbc fssm spv spvasm dds bk2 awc r9modeldata obj glb ogg wav exe dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Forbidden file extensions
        run: |
          specs=()
          for ext in $FORBIDDEN; do specs+=(":(glob,icase)**/*.$ext"); done
          found=$(git ls-files -- "${specs[@]}")
          if [ -n "$found" ]; then
            printf '::error file=%s::forbidden file type (game data or binary)\n' $found
            exit 1
          fi
      - name: Game data by content
        run: python3 -I scripts/check_no_game_data.py
