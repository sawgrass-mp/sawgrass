name: Dispatch
on:
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths: [scripts/dispatch.py]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dispatch-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

# Labels `ready` every task a maintainer opens (see scripts/dispatch.py). Issue events run this
# file and the script from the default branch and never check out pull request code. Issue text reaches the script
# through the API as data, never through the shell.
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 -I scripts/dispatch.py "$MODE"
        env:
          MODE: ${{ github.event_name == 'issues' && 'issue' || 'sweep' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
