name: Task
description: A unit of work that can be claimed. Maintainers label it `ready` after review.
title: "AREA-N: "
labels: [triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer checks it is finished (tests, numbers, behaviour).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files or crates the work may touch. Anything else needs a separate task.
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issues or pull requests that must land first.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (an evening)", "M (a few days)", "L (several pull requests)"]
    validations:
      required: true
