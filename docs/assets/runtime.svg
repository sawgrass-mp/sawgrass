<svg xmlns="http://www.w3.org/2000/svg" width="880" height="730" viewBox="0 0 880 730" role="img" aria-label="Allocators and runtimes. Tokio, multi-thread: p99 6.9 ms at 1.04 cores; Tokio, thread per core: p99 10.6 ms at 0.93 cores; smol: p99 35.0 ms at 1.44 cores; compio + compio-quic: p99 36.7 ms at 1.25 cores; Tokio, multi-thread: 0.72 of one core, p99 18 ms; Tokio, thread per core: 0.73 of one core, p99 23 ms; smol: 0.86 of one core, p99 62 ms; compio + compio-quic: 0.98 of one core, p99 215 ms; glibc malloc: tick p50 21.5 ms, 35 MB; mimalloc 2.3: tick p50 19.7 ms, 61 MB; jemalloc 5.3: tick p50 20.2 ms, 39 MB">
