<text x="28" y="44" class="h">Reliable events under packet loss</text>
<text x="28" y="68" class="s">p99 delivery time of an event, 40 ms round trip, 1% / 5% / 10% loss each way. Lower is better.</text>
<text x="28" y="118" class="l">QUIC (quinn)</text>
<text x="28" y="135" class="n">chosen: encrypted, multi-threaded</text>
<rect x="330" y="106" width="400" height="8" rx="4" fill="#13201b"/>
<rect x="330" y="106" width="41.0" height="8" rx="4" fill="url(#g)"/>
