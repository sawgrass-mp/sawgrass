<text x="28" y="310" class="l">Plain UDP</text>
<text x="28" y="327" class="n">floor: no reliability, no encryption</text>
<text x="330" y="318" class="n">no reliable delivery</text>
<text x="28" y="364" class="h">Server CPU with 1,000 players</text>
<text x="28" y="388" class="s">Cores used by the server at 20 Hz: 2 x 1,000-byte snapshots down, 64-byte state up, one event a second. Lower is better.</text>
