<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" role="img" aria-label="The real server under load. Budget 35 ms. 3,800 players, 1 gateway thread: p99 23.8 to 24.4 ms, 19.3 to 19.9 snapshots per second; 4,096 players, 1 gateway thread: p99 28.4 to 30.5 ms, 17.6 to 18.6 snapshots per second; 4,096 players, 2 gateway threads: p99 38.0 to 39.1 ms, 20.0 snapshots per second">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#14e1f0"/><stop offset="1" stop-color="#7cf000"/></linearGradient></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.h{font-size:22px;font-weight:700;fill:#e8fff4}.s{font-size:13px;fill:#8fb3a6}.l{font-size:15px;font-weight:600;fill:#e8fff4}.n{font-size:12px;fill:#7d9a90}.p{font-size:14px;font-weight:700;fill:#a6ff4d}.w{font-size:14px;font-weight:700;fill:#ff9f43}.b{font-size:12px;fill:#ffb454}</style>
<rect width="880" height="466" rx="16" fill="#060a08"/>
<rect x="1" y="1" width="878" height="464" rx="15" fill="none" stroke="#1d3b2f"/>
<text x="28" y="44" class="h">Tick p99 of the real server, dense crowd at 20 Hz</text>
<text x="28" y="68" class="s">Two counted runs per row on the project's 4-core server machine, two cores for the server. Lower is better.</text>
<text x="28" y="122" class="l">3,800 players, 1 gateway thread</text>
<text x="28" y="139" class="n">series 2, seeds 3 and 4</text>
<rect x="330" y="114" width="370" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="114" width="180.6" height="12" rx="6" fill="url(#g)"/>
<text x="852" y="125" class="p" text-anchor="end">23.8 to 24.4 ms</text>
<text x="28" y="162" class="l">4,096 players, 1 gateway thread</text>
<text x="28" y="179" class="n">series 3, seeds 1 and 2</text>
<rect x="330" y="154" width="370" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="154" width="225.7" height="12" rx="6" fill="url(#g)"/>
<text x="852" y="165" class="p" text-anchor="end">28.4 to 30.5 ms</text>
<text x="28" y="202" class="l">4,096 players, 2 gateway threads</text>
<text x="28" y="219" class="n">series 3, seeds 1 and 2</text>
<rect x="330" y="194" width="370" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="194" width="289.3" height="12" rx="6" fill="#ff9f43"/>
<text x="852" y="205" class="w" text-anchor="end">38.0 to 39.1 ms</text>
<line x1="589.0" y1="106" x2="589.0" y2="212" stroke="#ffb454" stroke-dasharray="4 4"/>
<text x="593.0" y="102" class="b">budget 35 ms</text>
<text x="28" y="256" class="h">Snapshots each bot received per second</text>
<text x="28" y="280" class="s">20 is every tick. Fewer means the gateway dropped snapshots to keep up.</text>
<text x="28" y="326" class="l">3,800 players, 1 gateway thread</text>
<text x="28" y="343" class="n">series 2, seeds 3 and 4</text>
<rect x="330" y="318" width="370" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="318" width="357.1" height="12" rx="6" fill="url(#g)"/>
<text x="852" y="329" class="p" text-anchor="end">19.3 to 19.9/s</text>
<text x="28" y="366" class="l">4,096 players, 1 gateway thread</text>
<text x="28" y="383" class="n">series 3, seeds 1 and 2</text>
<rect x="330" y="358" width="370" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="358" width="325.6" height="12" rx="6" fill="#ff9f43"/>
<text x="852" y="369" class="w" text-anchor="end">17.6 to 18.6/s</text>
<text x="28" y="406" class="l">4,096 players, 2 gateway threads</text>
<text x="28" y="423" class="n">series 3, seeds 1 and 2</text>
<rect x="330" y="398" width="370" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="398" width="370.0" height="12" rx="6" fill="url(#g)"/>
<text x="852" y="409" class="p" text-anchor="end">20.0/s</text>
<text x="28" y="444" class="s">Server cores used, in the order above: 1.41 to 1.42, 1.48 to 1.51, 1.85 to 1.86.</text>
</svg>
