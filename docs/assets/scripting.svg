<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" aria-label="Scripting engines. WebAssembly (wasmtime): 0.8 ms, stops an endless loop, no library call to test, caps memory; JavaScript, V8: 1.0 ms, stops an endless loop, stops a long library call, caps memory; LuaJIT: 1.2 ms, does not stop an endless loop, does not stop a long library call, caps memory; Luau, native code: 6.5 ms, stops an endless loop, stops a long library call, caps memory; Luau, interpreter: 15.8 ms, stops an endless loop, stops a long library call, caps memory; LuaJIT, JIT off: 11.0 ms, stops an endless loop, does not stop a long library call, caps memory; Lua 5.4: 26.3 ms, stops an endless loop, does not stop a long library call, caps memory; JavaScript, QuickJS-ng: 37.7 ms, stops an endless loop, stops a long library call, caps memory; Rhai: 282.5 ms, stops an endless loop, no library call to test, does not cap memory">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#14e1f0"/><stop offset="1" stop-color="#7cf000"/></linearGradient></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.h{font-size:22px;font-weight:700;fill:#e8fff4}.s{font-size:13px;fill:#8fb3a6}.l{font-size:15px;font-weight:600;fill:#e8fff4}.n{font-size:12px;fill:#7d9a90}.p{font-size:14px;font-weight:700;fill:#a6ff4d}.v{font-size:14px;font-weight:600;fill:#cfe9df}.ok{font-size:16px;font-weight:700;fill:#a6ff4d}.bad{font-size:16px;font-weight:700;fill:#ff6b6b}</style>
<rect width="960" height="494" rx="16" fill="#060a08"/>
<rect x="1" y="1" width="958" height="492" rx="15" fill="none" stroke="#1d3b2f"/>
<text x="28" y="44" class="h">Script time per tick for 4,096 players</text>
<text x="28" y="68" class="s">One zone check per player (64 zones) on one core, limits on; log scale, the dashed line is the whole 50 ms tick.</text>
<text x="790" y="106" class="s" text-anchor="middle">loop</text>
<text x="856" y="106" class="s" text-anchor="middle">library call</text>
<text x="922" y="106" class="s" text-anchor="middle">memory</text>
<text x="856" y="88" class="s" text-anchor="middle">stops or caps</text>
<text x="28" y="136" class="l">WebAssembly (wasmtime)</text>
<text x="28" y="153" class="n">guest in Rust, compiled ahead of time</text>
<rect x="330" y="128" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="128" width="19.4" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="139" class="v">0.8 ms</text>
<text x="790" y="140" class="ok" text-anchor="middle">✓</text>
<text x="856" y="140" class="n" text-anchor="middle">–</text>
<text x="922" y="140" class="ok" text-anchor="middle">✓</text>
<text x="28" y="176" class="l">JavaScript, V8</text>
<text x="28" y="193" class="n">JIT; 1.5 MB per isolate</text>
<rect x="330" y="168" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="168" width="33.9" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="179" class="v">1.0 ms</text>
<text x="790" y="180" class="ok" text-anchor="middle">✓</text>
<text x="856" y="180" class="ok" text-anchor="middle">✓</text>
<text x="922" y="180" class="ok" text-anchor="middle">✓</text>
<text x="28" y="216" class="l">LuaJIT</text>
<text x="28" y="233" class="n">JIT on: an endless loop is never stopped</text>
<rect x="330" y="208" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="208" width="43.6" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="219" class="v">1.2 ms</text>
<text x="790" y="220" class="bad" text-anchor="middle">✗</text>
<text x="856" y="220" class="bad" text-anchor="middle">✗</text>
<text x="922" y="220" class="ok" text-anchor="middle">✓</text>
<text x="28" y="256" class="l">Luau, native code</text>
<text x="28" y="273" class="n">recommended: mlua with luau-jit</text>
<rect x="330" y="248" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="248" width="122.7" height="12" rx="6" fill="url(#g)"/>
<text x="672" y="259" class="p">6.5 ms</text>
<text x="790" y="260" class="ok" text-anchor="middle">✓</text>
<text x="856" y="260" class="ok" text-anchor="middle">✓</text>
<text x="922" y="260" class="ok" text-anchor="middle">✓</text>
<text x="28" y="296" class="l">Luau, interpreter</text>
<text x="28" y="313" class="n">mlua, the roadmap's proposal</text>
<rect x="330" y="288" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="288" width="165.1" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="299" class="v">15.8 ms</text>
<text x="790" y="300" class="ok" text-anchor="middle">✓</text>
<text x="856" y="300" class="ok" text-anchor="middle">✓</text>
<text x="922" y="300" class="ok" text-anchor="middle">✓</text>
<text x="28" y="336" class="l">LuaJIT, JIT off</text>
<text x="28" y="353" class="n">still hangs inside string.find</text>
<rect x="330" y="328" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="328" width="147.8" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="339" class="v">11.0 ms</text>
<text x="790" y="340" class="ok" text-anchor="middle">✓</text>
<text x="856" y="340" class="bad" text-anchor="middle">✗</text>
<text x="922" y="340" class="ok" text-anchor="middle">✓</text>
<text x="28" y="376" class="l">Lua 5.4</text>
<text x="28" y="393" class="n">hangs inside string.find</text>
<rect x="330" y="368" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="368" width="189.3" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="379" class="v">26.3 ms</text>
<text x="790" y="380" class="ok" text-anchor="middle">✓</text>
<text x="856" y="380" class="bad" text-anchor="middle">✗</text>
<text x="922" y="380" class="ok" text-anchor="middle">✓</text>
<text x="28" y="416" class="l">JavaScript, QuickJS-ng</text>
<text x="28" y="433" class="n">rquickjs</text>
<rect x="330" y="408" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="408" width="206.5" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="419" class="v">37.7 ms</text>
<text x="790" y="420" class="ok" text-anchor="middle">✓</text>
<text x="856" y="420" class="ok" text-anchor="middle">✓</text>
<text x="922" y="420" class="ok" text-anchor="middle">✓</text>
<text x="28" y="456" class="l">Rhai</text>
<text x="28" y="473" class="n">pure Rust; limits per value, not in total</text>
<rect x="330" y="448" width="330" height="12" rx="6" fill="#13201b"/>
<rect x="330" y="448" width="302.7" height="12" rx="6" fill="#3f8f7a"/>
<text x="672" y="459" class="v">282.5 ms</text>
<text x="790" y="460" class="ok" text-anchor="middle">✓</text>
<text x="856" y="460" class="n" text-anchor="middle">–</text>
<text x="922" y="460" class="bad" text-anchor="middle">✗</text>
<line x1="550.0" x2="550.0" y1="122" y2="466" stroke="#a6ff4d" stroke-dasharray="4 4" stroke-width="1.5"/>
<text x="550.0" y="118" class="n" text-anchor="middle">50 ms tick</text>
