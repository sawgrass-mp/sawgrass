<svg xmlns="http://www.w3.org/2000/svg" width="900" height="482" viewBox="0 0 900 482" role="img" aria-label="Scripting engines. WebAssembly (wasmtime): 0.8 ms, stops an endless loop, caps memory; JavaScript, V8: 1.0 ms, stops an endless loop, caps memory; LuaJIT: 1.2 ms, does not stop an endless loop, caps memory; Luau, native code: 6.5 ms, stops an endless loop, caps memory; Luau, interpreter: 15.8 ms, stops an endless loop, caps memory; LuaJIT, JIT off: 11.0 ms, stops an endless loop, caps memory; Lua 5.4: 26.3 ms, stops an endless loop, caps memory; JavaScript, QuickJS-ng: 37.7 ms, stops an endless loop, caps memory; Rhai: 282.5 ms, stops an endless loop, does not cap memory">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#14e1f0"/><stop offset="1" stop-color="#7cf000"/></linearGradient></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.h{font-size:22px;font-weight:700;fill:#e8fff4}.s{font-size:13px;fill:#8fb3a6}.l{font-size:15px;font-weight:600;fill:#e8fff4}.n{font-size:12px;fill:#7d9a90}.p{font-size:14px;font-weight:700;fill:#a6ff4d}.v{font-size:14px;font-weight:600;fill:#cfe9df}.ok{font-size:16px;font-weight:700;fill:#a6ff4d}.bad{font-size:16px;font-weight:700;fill:#ff6b6b}</style>
