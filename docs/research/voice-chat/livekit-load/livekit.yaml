# LiveKit server settings for the NET-7 runs: one node, loopback only, one UDP port for all media.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
# A placeholder key for a server bound to loopback only, not a credential.
keys:
  devkey: voice-bench-secret-of-at-least-32-characters
logging:
  level: warn
