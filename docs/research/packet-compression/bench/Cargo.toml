[package]
name = "compression-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

# Standalone: not part of the Sawgrass workspace, so its dependencies never reach the project's graph.
[workspace]

[dependencies]
sawgrass-protocol = { path = "../../../../crates/sawgrass-protocol" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
zstd = "0.13"

[profile.release]
debug = "line-tables-only"
