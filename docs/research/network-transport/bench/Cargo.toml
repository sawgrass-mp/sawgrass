[package]
name = "transport-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

# Standalone: not part of the Sawgrass workspace, so its dependencies never reach the project's graph.
[workspace]

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
quinn = "0.11"
rcgen = "0.14"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
rusty_enet = "0.4"
renet = "2"
renet_netcode = "2"
game-networking-sockets = { version = "0.3", optional = true }

[features]
# Valve's GameNetworkingSockets: builds the C++ library, needs cmake, protobuf and OpenSSL.
gns = ["dep:game-networking-sockets"]

[profile.release]
debug = "line-tables-only"
